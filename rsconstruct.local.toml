# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.
#
# The C/C++ sources under examples/ and exercises/ are STM32 target code
# (they include vendor headers like stm32wl55xx.h and some are bare snippets),
# so they are not host-compilable and are only term/markdown checked here.
# The workspace/ tree is generated STM32CubeIDE/CMake output and is excluded.
# The STM32CubeWL/ tree is the externally-cloned vendor HAL package (gitignored)
# and is likewise excluded from linting.

[vars]
generated_excludes = [
	"/workspace/",
	"/STM32CubeWL/",
]

# Markdown lives at the repo root (README, per-exercise exercise.md files)
# rather than in the canonical src/docs/... set, and the generated/vendor
# trees must be excluded.
[processor.rumdl]
src_dirs = ["."]
src_exclude_dirs = "${generated_excludes}"

# Canonical scans "." for TOML too, but the vendor/generated trees carry
# their own TOML that must not be linted.
[processor.taplo]
src_exclude_dirs = "${generated_excludes}"

# Only the helper shell scripts are ours; canonical's wider src_dirs would
# reach into the vendor tree.
[processor.shellcheck]
src_dirs = ["scripts"]
src_extensions = [".sh"]

# Install the pinned demo libraries so pylint/mypy can resolve the imports in
# the exercises; without this CI has none of them and every import fails.
[dependencies]
pip = [
	"-r",
	"requirements.txt",
]

# ─── firmware build (rsconstruct mirror of the root Makefile) ────────────────
#
# These stanzas make `rsconstruct build` produce the same artifacts as `make`,
# at the same in-tree paths (app_<tag>.elf / app_<tag>.map /
# firmware_<tag>.bin beside each main*.c), so scripts/flash_exercise.sh works
# unchanged. Layout mirrors the Makefile's structure:
#
#   - two explicit products build the shared HAL driver libraries (one per
#     core) via scripts/rsc_build_hal_lib.sh; their declared output .a files
#     give the HAL image products real dependency edges, so ordering is
#     correct even on a cold build (fixed-point discovery injects the libs
#     as virtual files before they exist);
#   - six explicit products build the six image classes of the Makefile's
#     IMAGE template (single bare/hal, dual cm4/cm0p x bare/hal) via
#     scripts/rsc_build_image.sh; the main*.c inputs are glob-discovered
#     like the Makefile's discovery, but output_files are enumerated (a NEW
#     exercise builds automatically via the glob, yet its artifacts must be
#     added here to be cached/cleaned);
#   - cc_single_file builds the standalone host examples/*.cc to
#     examples/*.elf, like the Makefile's examples target.
#
# Rebuild granularity is per image class (a changed main_bare.c relinks all
# bare single-core images -- each is one small compile+link), not per object
# like make. The STM32CubeWL clone is gitignored, so its HAL sources and
# CMSIS headers cannot be tracked as inputs; scripts/clone_cubewl.sh stands
# in as the proxy trigger for vendor-tree changes.

[processor.cc_single_file]
src_dirs = ["examples"]
src_extensions = [".cc"]
output_dir = "."
cxxflags = ["-Wall", "-O2"]

[processor.explicit.hal_lib_cm4]
command = "scripts/rsc_build_hal_lib.sh"
args = ["cm4"]
required_tools = ["arm-none-eabi-gcc", "arm-none-eabi-ar"]
inputs = [
	"scripts/rsc_build_hal_lib.sh",
	"scripts/clone_cubewl.sh",
	"exercises/common/stm32wlxx_hal_conf.h",
]
output_files = ["exercises/common/libhal_rsc_cm4.a"]

[processor.explicit.hal_lib_cm0]
command = "scripts/rsc_build_hal_lib.sh"
args = ["cm0"]
