# rsconstruct build configuration for this repository.

[build]

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["."]
src_exclude_dirs = "${generated_excludes}"

[processor.zspell]
src_dirs = ["exercises"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts", "exercises"]

[processor.pylint]
src_dirs = ["scripts", "exercises"]

[processor.mypy]
src_dirs = ["scripts", "exercises"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts"]
args = ["--severity=error", "--shell=bash"]
src_extensions = [".sh"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]
src_exclude_dirs = "${generated_excludes}"

# ─── repo-specific configuration ────────────────────────────────────────────

[vars]
generated_excludes = [
	"/workspace/",
	"/STM32CubeWL/",
]

[processor.cc_single_file]
src_dirs = ["examples"]
src_extensions = [".cc"]
output_dir = "."
cxxflags = ["-Wall", "-O2"]

[processor.explicit.hal_lib_cm4]
command = "scripts/rsc_build_hal_lib.sh"
args = ["cm4"]
required_tools = ["arm-none-eabi-gcc", "arm-none-eabi-ar"]
inputs = [
	"scripts/rsc_build_hal_lib.sh",
	"scripts/clone_cubewl.sh",
	"exercises/common/stm32wlxx_hal_conf.h",
]
output_files = ["exercises/common/libhal_rsc_cm4.a"]

[processor.explicit.hal_lib_cm0]
command = "scripts/rsc_build_hal_lib.sh"
args = ["cm0"]
required_tools = ["arm-none-eabi-gcc", "arm-none-eabi-ar"]
inputs = [
	"scripts/rsc_build_hal_lib.sh",
