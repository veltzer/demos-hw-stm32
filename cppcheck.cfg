<?xml version="1.0"?>
<def format="2">
  <!-- functions called from outside the C code cppcheck sees: one line each, saying who calls it -->
  <!-- Cortex-M vector table (startup_stm32wl55jcix*.s) -->
  <entrypoint name="SysTick_Handler"/>
  <entrypoint name="PendSV_Handler"/>
  <entrypoint name="EXTI0_IRQHandler"/>
  <entrypoint name="TIM16_IRQHandler"/>
  <!-- startup code calls SystemInit from Reset_Handler; SystemCoreClockUpdate is CMSIS API for the application -->
  <entrypoint name="SystemInit"/>
  <entrypoint name="SystemCoreClockUpdate"/>
  <!-- weak callback invoked by the HAL library (libhal_rsc_cm*.a) -->
  <entrypoint name="HAL_GPIO_EXTI_Callback"/>
</def>
